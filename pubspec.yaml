name: native_platform_ui
description: >-
  Native iOS UI for Flutter — buttons, switches, SF Symbols, liquid glass,
  alerts, popovers, and bottom navigation via platform views.
version: 0.0.1
homepage:

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_ui
        pluginClass: NativeUiPlugin
      ios:
        pluginClass: NativeUiPlugin
